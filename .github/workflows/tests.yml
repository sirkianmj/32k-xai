name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "jax[cpu]==0.12.0.1" numpy==2.5.4 scipy==1.18.1 pandas==3.1.0 networkx==3.7 tqdm==4.70.1
          pip install fastapi==0.162.0 "uvicorn[standard]==0.54.0" pytest==8.3.0
      - name: Run pytest
        env:
          P6C_PARAMS: ${{ github.workspace }}/work_g2/synthetic_32k_p6d.pkl
          JAX_PLATFORMS: cpu
        run: |
          cd work_env
          python test_replay.py
          python test_xai_trace.py
