name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "jax[cpu]" numpy scipy pandas networkx tqdm
          pip install fastapi "uvicorn[standard]" pytest
      - name: Run pytest
        env:
          P6C_PARAMS: ${{ github.workspace }}/work_g2/synthetic_32k_p6d.pkl
          JAX_PLATFORMS: cpu
        run: |
          cd work_env
          python -m pytest test_replay.py test_xai_trace.py -v
