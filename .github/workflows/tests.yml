name: Run Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install "jax[cpu]" numpy scipy pandas networkx tqdm
          pip install fastapi "uvicorn[standard]" pytest
      - name: Run pytest
        env:
          P6C_PARAMS: ${{ github.workspace }}/work_g2/synthetic_32k_p6d.pkl
          JAX_PLATFORMS: cpu
        run: |
          cd work_env
          python -m pytest test_replay.py test_xai_trace.py -v
