name: Sign Existing Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sign (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions: read-all

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download ${{ github.event.inputs.tag }} --dir release-assets

      - name: Sign assets
        run: |
          cd release-assets
          for asset in *; do
            if [[ "$asset" != *.sigstore.json ]]; then
              echo "Signing $asset..."
              cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
            fi
          done

      - name: Upload signatures to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.inputs.tag }} release-assets/*.sigstore.json
