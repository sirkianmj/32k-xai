name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read


permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - name: Initialize CodeQL
      uses: github/codeql-action/init@f3519a709126c6e2ce44a63fb82c6aeb5bf67bf0
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@f3519a709126c6e2ce44a63fb82c6aeb5bf67bf0
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@f3519a709126c6e2ce44a63fb82c6aeb5bf67bf0
