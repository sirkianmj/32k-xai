name: Build Linux executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-cpu.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime + build dependencies
        run: |
          pip install "jax[cpu]" numpy scipy pandas networkx tqdm
          pip install fastapi "uvicorn[standard]"
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller packaging/linux/build-linux.spec --clean --noconfirm

      - name: Verify the executable exists
        run: |
          if [ ! -f "dist/XAI-32k/XAI-32k" ]; then
            echo "FATAL: dist/XAI-32k/XAI-32k not found"
            exit 1
          fi
          du -sh dist/XAI-32k

      - name: Package as tarball
        run: tar -czvf XAI-32k-linux.tar.gz -C dist XAI-32k

      - name: Upload as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XAI-32k-linux
          path: XAI-32k-linux.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          files: XAI-32k-linux.tar.gz
