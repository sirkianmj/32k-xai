name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-cpu.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime + build dependencies
        run: |
          pip install "jax[cpu]" numpy scipy pandas networkx tqdm
          pip install fastapi "uvicorn[standard]"
          pip install pywebview pythonnet clr-loader pyinstaller pillow

      - name: Convert Mac icon to Windows .ico
        shell: pwsh
        run: |
          $src = "assets/app-icon.png"
          if (!(Test-Path $src)) {
            Write-Error "Source icon not found: $src"
            exit 1
          }
          python -c "from PIL import Image; img = Image.open('assets/app-icon.png'); img.save('packaging/windows/icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          if (!(Test-Path "packaging/windows/icon.ico")) {
            Write-Error "Icon conversion failed"
            exit 1
          }

      - name: Build with PyInstaller
        run: |
          pyinstaller packaging/windows/build.spec --clean --noconfirm

      - name: Verify the executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/XAI-32k/XAI-32k.exe")) {
            Write-Error "XAI-32k.exe not found"
            exit 1
          }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build the Windows wizard installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/installer.iss
          if (!(Test-Path "dist/XAI-32k-Setup.exe")) {
            Write-Error "Installer not created"
            exit 1
          }

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/XAI-32k -DestinationPath XAI-32k-windows.zip

      - name: Upload portable zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: XAI-32k-windows-portable
          path: XAI-32k-windows.zip
          retention-days: 30

      - name: Upload wizard installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: XAI-32k-windows-setup
          path: dist/XAI-32k-Setup.exe
          retention-days: 30

      - name: Attach both to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          files: |
            XAI-32k-windows.zip
            dist/XAI-32k-Setup.exe
