name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime + build dependencies
        run: |
          pip install "jax[cpu]" numpy scipy pandas networkx tqdm
          pip install fastapi "uvicorn[standard]"
          pip install pywebview pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller packaging/windows/build.spec --clean --noconfirm

      - name: Verify the executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist/XAI-32k/XAI-32k.exe")) {
            Write-Error "XAI-32k.exe not found"
            exit 1
          }
          Get-ChildItem dist/XAI-32k | Measure-Object -Property Length -Sum |
            Select-Object Count, @{N='SizeMB';E={[math]::Round($_.Sum/1MB,1)}}

      - name: Zip the portable folder
        shell: pwsh
        run: Compress-Archive -Path dist/XAI-32k -DestinationPath XAI-32k-windows.zip

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAI-32k-windows
          path: XAI-32k-windows.zip
          retention-days: 30

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: XAI-32k-windows.zip
